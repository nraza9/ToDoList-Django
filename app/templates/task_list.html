<!DOCTYPE html>
<html>
 <head>
     <title>To-Do List</title>
 </head>
 <body>
     <h1>To-Do List(task_list.html)</h1>
     <a href="add/">Add Task</a>
     <ul>
         {% for task in tasks %}
             <li>
                {{ task.id }} : {{ task.title }} <a href="delete/{{ task.id }}/">Delete</a>
             </li>
         {% endfor %}
     </ul>
 </body>
 </html>
